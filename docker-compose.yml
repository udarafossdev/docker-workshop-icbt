services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat1
      - chat2

  chat1:
    build: ./server
    environment:
      INSTANCE_NAME: chat1
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  chat2:
    build: ./server
    environment:
      INSTANCE_NAME: chat2
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
