<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Docker Chat Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    #messages { border: 1px solid #ddd; border-radius: 10px; padding: 15px; height: 400px; overflow-y: auto; }
    .message { margin: 8px 0; }
    .system { color: #777; font-style: italic; }
    .meta { font-size: 12px; color: #888; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { padding: 10px; }
    #name { width: 120px; }
    #text { flex: 1; }
    button { padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>💬 Docker Chat Lab</h1>
  <p>Open this page in two browser tabs and start chatting.</p>
  <div id="messages"></div>

  <form id="form">
    <input id="name" placeholder="Your name" value="Student">
    <input id="text" placeholder="Type a message..." autocomplete="off">
    <button>Send</button>
  </form>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const nameInput = document.getElementById("name");
    const textInput = document.getElementById("text");

    const protocol = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${protocol}://${location.host}/ws`);

    function addMessage(data) {
      const div = document.createElement("div");
      div.className = data.type === "system" ? "message system" : "message";

      if (data.type === "system") {
        div.textContent = data.text;
      } else {
        div.innerHTML =
          `<strong>${escapeHtml(data.user)}</strong>: ${escapeHtml(data.text)}
           <div class="meta">handled by ${escapeHtml(data.server)}</div>`;
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    socket.onopen = () => addMessage({
      type: "system",
      text: "WebSocket connected through Nginx"
    });

    socket.onmessage = event => addMessage(JSON.parse(event.data));

    socket.onerror = () => addMessage({
      type: "system",
      text: "WebSocket error"
    });

    socket.onclose = () => addMessage({
      type: "system",
      text: "Connection closed"
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (socket.readyState !== WebSocket.OPEN) return;

      socket.send(JSON.stringify({
        user: nameInput.value || "Anonymous",
        text: textInput.value
      }));

      textInput.value = "";
      textInput.focus();
    });

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#039;"
      }[char]));
    }
  </script>
</body>
</html>
